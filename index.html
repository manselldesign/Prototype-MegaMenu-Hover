<title>Indiana Zooniversity — Mega menu (hover)</title>
<meta name="description" content="Prototype D: Indiana Zooniversity mega menu that opens on hover. Live at https://manselldesign.github.io/Prototype-MegaMenu-Hover/">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --crimson: #990000;
    --crimson-dk: #6D0808;
    --cream: #F0E1CC;
    --ink: #1F2528;
    --body: #343C42;
    --white: #fff;
    --header-pad: 16px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--white);
    font-family: "Roboto Flex", system-ui, sans-serif;
    font-variation-settings: "wght" 350, "wdth" 110, "opsz" 16;
    font-size: 16px;
    line-height: 24px;
  }
  body.lock { overflow: hidden; }
  a { color: inherit; }
  :focus-visible {
    outline: 2px solid var(--crimson);
    outline-offset: 2px;
  }
  .skip {
    position: absolute;
    left: 16px;
    top: -40px;
    background: var(--ink);
    color: var(--white);
    padding: 8px 12px;
    z-index: 80;
  }
  .skip:focus { top: 8px; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--white);
    border-bottom: 1px solid var(--cream);
  }
  .header-bar { padding: 24px var(--header-pad) 0; }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 0 24px 16px;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--ink);
    min-width: 0;
  }
  .lockup svg { flex: 0 0 auto; display: block; }
  .lockup-name {
    margin: 0;
    font-size: 16px;
    line-height: 16px;
    letter-spacing: 0.25px;
    text-transform: uppercase;
    white-space: nowrap;
    font-variation-settings: "wght" 700, "wdth" 35, "opsz" 14;
  }
  .utilities {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 0 0 auto;
  }
  .util-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--crimson);
    background: var(--white);
    color: var(--crimson);
    text-decoration: none;
    font-size: 14px;
    line-height: 20px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 14;
    white-space: nowrap;
  }
  .util-btn:hover { background: var(--crimson); color: var(--white); }
  .util-btn:hover .arrow path { fill: var(--white); }
  .icon-btn {
    position: relative;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--ink);
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--ink); }
  .icon-btn:hover svg path { fill: var(--white); }
  .icon-btn[aria-expanded="true"] { background: var(--ink); }
  .icon-btn[aria-expanded="true"] svg path { fill: var(--white); }
  .menu-btn { display: none; }

  .nav-row { padding: 0 24px 16px; }
  .primary-nav { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
  .nav-link {
    appearance: none;
    background: none;
    border: 0;
    padding: 2px 0;
    margin: 0;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    line-height: 20px;
    color: var(--ink);
    text-decoration: none;
    font-variation-settings: "wght" 350, "wdth" 115, "opsz" 14;
    box-shadow: inset 0 -2px 0 transparent;
  }
  .nav-link:hover { text-decoration: underline; text-underline-offset: 5px; }
  .nav-link.is-open {
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 14;
    text-decoration: none;
    box-shadow: inset 0 -2px 0 var(--crimson);
  }

  .mega {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    background: var(--white);
    border-top: 1px solid var(--cream);
    box-shadow: 0 24px 40px rgba(31, 37, 40, 0.14);
    max-height: min(70vh, 640px);
    overflow: auto;
    z-index: 41;
  }
  .mega-inner {
    display: grid;
    grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
    gap: 40px 48px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 32px 40px 40px;
  }
  .mega-eyebrow, .hero-eyebrow, .page-eyebrow {
    margin: 0 0 12px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--crimson);
    font-weight: 400;
  }
  .mega-title {
    display: inline-block;
    color: var(--ink);
    text-decoration: none;
    font-size: 29px;
    line-height: 32px;
    font-variation-settings: "wght" 700, "wdth" 100, "opsz" 29;
  }
  .mega-title:hover { color: var(--crimson); }
  .mega-lede, .lede {
    margin: 12px 0 0;
    color: var(--body);
    font-size: 16px;
    line-height: 24px;
    font-variation-settings: "wght" 350, "wdth" 110, "opsz" 16;
  }
  .mega-groups {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 28px 32px;
    align-content: start;
  }
  .mega-l2 {
    display: inline-block;
    margin: 0 0 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    line-height: 24px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 16;
  }
  .mega-l2:hover { color: var(--crimson); }
  .mega-sub { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mega-sub a {
    color: var(--body);
    text-decoration: none;
    font-size: 14px;
    line-height: 20px;
    font-variation-settings: "wght" 350, "wdth" 110, "opsz" 14;
  }
  .mega-sub a:hover { color: var(--crimson); text-decoration: underline; text-underline-offset: 3px; }

  .search-panel { max-width: 800px; margin: 0 auto; padding: 28px 40px 36px; }
  .search-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 20px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 14;
  }
  .search-field {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--ink);
    padding: 0 12px;
    height: 48px;
  }
  .search-field input {
    flex: 1;
    border: 0;
    outline: none;
    font: inherit;
    font-size: 16px;
    line-height: 24px;
    color: var(--ink);
    background: transparent;
    font-variation-settings: "wght" 350, "wdth" 110, "opsz" 16;
  }
  .search-results { list-style: none; margin: 16px 0 0; padding: 0; display: grid; }
  .search-results a {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--cream);
    text-decoration: none;
    color: var(--ink);
  }
  .search-results a:hover { color: var(--crimson); }
  .search-parent {
    color: var(--body);
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .search-empty { color: var(--body); margin: 16px 0 0; }

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(31, 37, 40, 0.45);
    z-index: 30;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, 100%);
    background: var(--white);
    z-index: 60;
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 32px rgba(31, 37, 40, 0.18);
  }
  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--cream);
  }
  .drawer-title {
    margin: 0;
    font-size: 23px;
    line-height: 28px;
    font-variation-settings: "wght" 700, "wdth" 100, "opsz" 23;
  }
  .drawer-body { padding: 16px 20px 32px; overflow: auto; }
  .drawer-search { margin-bottom: 16px; }
  .acc { border-bottom: 1px solid var(--cream); }
  .acc-row { display: flex; align-items: stretch; }
  .acc-link, .acc-toggle {
    background: none;
    border: 0;
    color: var(--ink);
    text-align: left;
    text-decoration: none;
    font-size: 20px;
    line-height: 24px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 20;
  }
  .acc-link { flex: 1; padding: 16px 8px 16px 0; }
  .acc-link:hover { color: var(--crimson); }
  .acc-toggle {
    width: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .acc-toggle svg { transition: transform 0.15s ease; }
  .acc-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .acc-panel { display: grid; gap: 4px; padding: 0 0 16px 12px; }
  .acc-l2, .acc-l3 {
    text-decoration: none;
    color: var(--ink);
    padding: 6px 0;
  }
  .acc-l2 { font-variation-settings: "wght" 600, "wdth" 115, "opsz" 16; }
  .acc-l3 { color: var(--body); padding-left: 12px; font-size: 15px; }
  .acc-l2:hover, .acc-l3:hover { color: var(--crimson); }
  .drawer-utils { display: grid; gap: 8px; margin-top: 20px; }
  .drawer-utils .util-btn { justify-content: center; height: 44px; }

  .page { min-height: calc(100vh - 180px); }
  .hero { padding: 72px 24px 0; text-align: center; }
  .hero h1 {
    margin: 0 auto;
    max-width: 18ch;
    color: var(--crimson);
    font-size: clamp(36px, 5vw, 56px);
    line-height: 1.02;
    letter-spacing: 0;
    text-transform: uppercase;
    font-variation-settings: "wght" 825, "wdth" 100, "opsz" 54;
  }
  .hero .lede { max-width: 42rem; margin: 20px auto 0; font-size: 20px; line-height: 28px; }
  .btn-strong {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    height: 48px;
    padding: 0 16px;
    background: var(--crimson);
    color: var(--white);
    text-decoration: none;
    font-size: 16px;
    line-height: 24px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 16;
  }
  .btn-strong:hover { background: var(--crimson-dk); }
  .hero-figure { margin: 48px auto 0; max-width: 1280px; padding: 0 24px 64px; }
  .hero-figure img { display: block; width: 100%; height: auto; }

  .interior { max-width: 1100px; margin: 0 auto; padding: 40px 24px 72px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 20px; padding: 0; list-style: none; font-size: 14px; line-height: 20px; }
  .crumbs a { color: var(--body); text-decoration: none; }
  .crumbs a:hover { color: var(--crimson); text-decoration: underline; }
  .crumbs span[aria-hidden] { color: var(--cream); }
  .interior h1 {
    margin: 0;
    max-width: 20ch;
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1.05;
    font-variation-settings: "wght" 700, "wdth" 100, "opsz" 48;
  }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 32px; }
  .card {
    display: block;
    padding: 20px;
    border: 1px solid var(--cream);
    text-decoration: none;
    color: inherit;
    min-height: 100%;
  }
  .card:hover { border-color: var(--crimson); }
  .card strong {
    display: block;
    margin-bottom: 8px;
    font-size: 18px;
    line-height: 24px;
    font-variation-settings: "wght" 600, "wdth" 115, "opsz" 18;
  }
  .card p { margin: 0; color: var(--body); font-size: 15px; line-height: 22px; }

  .site-footer {
    background: var(--crimson);
    color: var(--white);
    padding: 28px 40px;
  }
  .site-footer a { color: var(--white); }
  .footer-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  .footer-lockup { display: flex; align-items: center; gap: 10px; font-variation-settings: "wght" 700, "wdth" 35; letter-spacing: 0.25px; text-transform: uppercase; font-size: 14px; }
  .footer-note { margin: 12px 0 0; font-size: 14px; line-height: 20px; max-width: 62ch; }
  .footer-note a { text-underline-offset: 3px; }

  @media (max-width: 1100px) {
    .mega-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 1023px) {
    .header-bar { padding-top: 16px; }
    .header-row { padding-bottom: 16px; }
    .util-btn, .nav-row { display: none; }
    .menu-btn { display: inline-flex; }
    .mega { display: none !important; }
    .hero { padding-top: 40px; }
    .hero h1 { max-width: 14ch; }
  }
  @media (max-width: 420px) {
    .lockup-name { font-size: 13px; letter-spacing: 0; }
    .header-row { padding-left: 8px; padding-right: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .acc-toggle svg { transition: none; }
  }

</head>

</header>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <h2 class="drawer-title" id="drawer-title">Menu</h2>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Close menu">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="#1F2528" d="m3.5 2.086 4.5 4.5 4.5-4.5L13.914 3.5 9.414 8l4.5 4.5-1.414 1.414-4.5-4.5-4.5 4.5L2.086 12.5l4.5-4.5-4.5-4.5L3.5 2.086Z"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>
<main id="main" class="page" tabindex="-1"></main>
<footer class="site-footer">
  <div class="footer-row">
    <div class="footer-lockup">
      <svg width="28" height="32" viewBox="0 0 41 48" aria-hidden="true">
        <path d="M41 0H0V48H41V0Z" fill="#fff"/>
        <path d="M25 11.5V14H27V28.5H23V9.5H25V7H16V9.5H18V28.5H14V14H16V11.5H7V14H9V30.5L12.5 34H18V37.5H16V41H25V37.5H23V34H28.5L32 30.5V14H34V11.5H25Z" fill="#990000"/>
      </svg>
      Indiana Zooniversity
    </div>
  </div>
  <p class="footer-note">Prototype D — the mega menu opens on hover from the top navigation. On a narrow screen, the same sections open in a tap drawer. Hub: <a href="https://basham.github.io/rivet-2026-06-17/">Rivet nav prototypes</a>.</p>
</footer>

<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("site-data").textContent);
  const SECTIONS = DATA.sections;
  const bySlug = new Map();
  const parentOf = new Map();
  const indexEntry = (node, parent) => {
    bySlug.set(node.slug, node);
    if (parent) parentOf.set(node.slug, parent.slug);
    (node.children || []).forEach((child) => indexEntry(child, node));
  };
  SECTIONS.forEach((section) => indexEntry(section, null));
  bySlug.set("index", DATA.home);

  const header = document.getElementById("site-header");
  const nav = document.getElementById("primary-nav");
  const mega = document.getElementById("mega");
  const scrim = document.getElementById("scrim");
  const drawer = document.getElementById("drawer");
  const drawerBody = document.getElementById("drawer-body");
  const main = document.getElementById("main");
  const searchToggle = document.getElementById("search-toggle");
  const menuToggle = document.getElementById("menu-toggle");
  const desktopQuery = window.matchMedia("(min-width: 1024px)");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
  const href = (slug) => (slug === "index" ? "#/" : "#/" + encodeURIComponent(slug));
  const desktop = () => desktopQuery.matches;

  let mode = null;
  let megaSlug = null;
  let closeTimer = 0;
  const openAcc = new Set();

  const chevron = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.263 15.146 12.31 8 6.263.854 4.737 2.146 9.69 8l-4.953 5.854 1.526 1.292Z"/></svg>';
  const searchIcon = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="#1F2528" d="M7 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM0 7a7 7 0 1 1 12.606 4.192l3.101 3.1-1.414 1.415-3.1-3.1A7 7 0 0 1 0 7Z"/></svg>';

  SECTIONS.forEach((section) => {
    const a = document.createElement("a");
    a.className = "nav-link";
    a.href = href(section.slug);
    a.dataset.slug = section.slug;
    a.dataset.nav = "";
    a.textContent = section.label;
    a.setAttribute("aria-expanded", "false");
    a.setAttribute("aria-controls", "mega");
    a.addEventListener("pointerenter", (event) => {
      if (!desktop() || event.pointerType === "touch") return;
      openMega(section.slug);
    });
    a.addEventListener("focus", () => {
      if (desktop()) openMega(section.slug);
    });
    a.addEventListener("click", (event) => {
      if (!desktop()) return;
      if (mode !== "mega" || megaSlug !== section.slug) {
        event.preventDefault();
        openMega(section.slug);
      }
    });
    nav.appendChild(a);
  });

  function sectionTrail(slug) {
    const trail = [];
    let current = slug;
    const guard = new Set();
    while (current && current !== "index" && !guard.has(current)) {
      guard.add(current);
      const node = bySlug.get(current);
      if (!node) break;
      trail.unshift(node);
      current = parentOf.get(current);
    }
    return trail;
  }

  function paintChrome() {
    const megaOpen = mode === "mega";
    const searchOpen = mode === "search";
    nav.querySelectorAll(".nav-link").forEach((link) => {
      const on = megaOpen && link.dataset.slug === megaSlug;
      link.classList.toggle("is-open", on);
      link.setAttribute("aria-expanded", on ? "true" : "false");
    });
    searchToggle.setAttribute("aria-expanded", searchOpen ? "true" : "false");
    menuToggle.setAttribute("aria-expanded", mode === "drawer" ? "true" : "false");
    mega.hidden = !(megaOpen || searchOpen);
    scrim.hidden = mode == null;
    drawer.hidden = mode !== "drawer";
    document.body.classList.toggle("lock", mode === "drawer");
  }

  function renderMega(section) {
    const groups = (section.children || []).map((child) => {
      const subs = (child.children || []).map((g) => `<li><a href="${href(g.slug)}" data-nav>${esc(g.label)}</a></li>`).join("");
      return `<div class="mega-group"><a class="mega-l2" href="${href(child.slug)}" data-nav>${esc(child.label)}</a>${subs ? `<ul class="mega-sub">${subs}</ul>` : ""}</div>`;
    }).join("");
    const eyebrow = section.eyebrow ? `<p class="mega-eyebrow">${esc(section.eyebrow)}</p>` : "";
    mega.innerHTML = `<div class="mega-inner"><div>${eyebrow}<a class="mega-title" href="${href(section.slug)}" data-nav>${esc(section.label)}</a>${section.lede ? `<p class="mega-lede">${esc(section.lede)}</p>` : ""}</div><div class="mega-groups">${groups}</div></div>`;
  }

  function searchHits(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    bySlug.forEach((node, slug) => {
      if (slug === "index") return;
      const blob = `${node.label} ${node.heading || ""} ${node.lede || ""}`.toLowerCase();
      if (blob.includes(q)) hits.push(node);
    });
    return hits.slice(0, 12);
  }

  function renderSearch(preset) {
    mega.innerHTML = `<form class="search-panel" id="search-form" role="search"><label class="search-label" for="site-search">Search the site</label><div class="search-field">${searchIcon}<input id="site-search" type="search" placeholder="Search the site" autocomplete="off"></div><div id="search-out"></div></form>`;
    const input = document.getElementById("site-search");
    const out = document.getElementById("search-out");
    const draw = () => {
      const hits = searchHits(input.value);
      if (!input.value.trim()) { out.innerHTML = ""; return; }
      if (!hits.length) { out.innerHTML = `<p class="search-empty">No matching pages.</p>`; return; }
      out.innerHTML = `<ul class="search-results">${hits.map((node) => {
        const parent = bySlug.get(parentOf.get(node.slug));
        const parentLabel = parent ? `<span class="search-parent">${esc(parent.label)}</span>` : "";
        return `<li><a href="${href(node.slug)}" data-nav><span>${esc(node.label)}</span>${parentLabel}</a></li>`;
      }).join("")}</ul>`;
    };
    input.addEventListener("input", draw);
    document.getElementById("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const first = searchHits(input.value)[0];
      if (first) location.hash = href(first.slug).slice(1);
    });
    if (preset) input.value = preset;
    input.focus();
    draw();
  }

  function renderDrawer() {
    const blocks = SECTIONS.map((section) => {
      const open = openAcc.has(section.slug);
      const links = (section.children || []).flatMap((child) => {
          const rows = [`<a class="acc-l2" href="${href(child.slug)}" data-nav>${esc(child.label)}</a>`];
          (child.children || []).forEach((g) => rows.push(`<a class="acc-l3" href="${href(g.slug)}" data-nav>${esc(g.label)}</a>`));
          return rows;
        }).join("");
      return `<div class="acc"><div class="acc-row"><a class="acc-link" href="${href(section.slug)}" data-nav>${esc(section.label)}</a><button class="acc-toggle" type="button" aria-expanded="${open ? "true" : "false"}" aria-label="Show pages in ${esc(section.label)}" data-acc="${esc(section.slug)}">${chevron}</button></div>${open ? `<div class="acc-panel">${links}</div>` : ""}</div>`;
    }).join("");
    drawerBody.innerHTML = `<form class="drawer-search" id="drawer-search" role="search"><label class="search-label" for="drawer-query">Search the site</label><div class="search-field">${searchIcon}<input id="drawer-query" type="search" placeholder="Search the site" autocomplete="off"></div><div id="drawer-out"></div></form><div id="drawer-acc">${blocks}</div><div class="drawer-utils"><a class="util-btn" href="#/internships" data-nav>Work at the Zoo</a><a class="util-btn" href="#/membership" data-nav>Become a Member</a></div>`;
    const query = document.getElementById("drawer-query");
    const out = document.getElementById("drawer-out");
    const acc = document.getElementById("drawer-acc");
    query.addEventListener("input", () => {
      const hits = searchHits(query.value);
      acc.hidden = !!query.value.trim();
      if (!query.value.trim()) { out.innerHTML = ""; return; }
      out.innerHTML = hits.length
        ? `<ul class="search-results">${hits.map((node) => `<li><a href="${href(node.slug)}" data-nav>${esc(node.label)}</a></li>`).join("")}</ul>`
        : `<p class="search-empty">No matching pages.</p>`;
    });
    document.getElementById("drawer-search").addEventListener("submit", (event) => event.preventDefault());
  }

  function openMega(slug) {
    window.clearTimeout(closeTimer);
    mode = "mega";
    megaSlug = slug;
    renderMega(bySlug.get(slug));
    paintChrome();
  }
  function openSearch() {
    window.clearTimeout(closeTimer);
    if (!desktop()) { openDrawer(); return; }
    mode = "search";
    megaSlug = null;
    renderSearch();
    paintChrome();
  }
  function openDrawer() {
    window.clearTimeout(closeTimer);
    mode = "drawer";
    megaSlug = null;
    renderDrawer();
    paintChrome();
    document.getElementById("drawer-close").focus();
  }
  function closeAll(restore) {
    window.clearTimeout(closeTimer);
    const was = mode;
    mode = null;
    megaSlug = null;
    paintChrome();
    if (restore && was === "drawer") menuToggle.focus();
    if (restore && was === "search") searchToggle.focus();
  }

  header.addEventListener("pointerleave", (event) => {
    if (mode !== "mega" && mode !== "search") return;
    if (event.pointerType === "touch") return;
    closeTimer = window.setTimeout(() => {
      if (mode === "mega" || mode === "search") closeAll(false);
    }, 180);
  });
  header.addEventListener("pointerenter", () => window.clearTimeout(closeTimer));
  header.addEventListener("focusout", (event) => {
    if (mode !== "mega" && mode !== "search") return;
    if (!header.contains(event.relatedTarget)) closeAll(false);
  });
  scrim.addEventListener("click", () => closeAll(false));
  searchToggle.addEventListener("click", () => {
    if (mode === "search") closeAll(true);
    else openSearch();
  });
  menuToggle.addEventListener("click", () => {
    if (mode === "drawer") closeAll(true);
    else openDrawer();
  });
  document.getElementById("drawer-close").addEventListener("click", () => closeAll(true));
  drawerBody.addEventListener("click", (event) => {
    const toggle = event.target.closest("[data-acc]");
    if (!toggle) return;
    const slug = toggle.getAttribute("data-acc");
    if (openAcc.has(slug)) openAcc.delete(slug);
    else openAcc.add(slug);
    renderDrawer();
    const next = drawerBody.querySelector(`[data-acc="${CSS.escape(slug)}"]`);
    if (next) next.focus();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && mode) {
      event.preventDefault();
      closeAll(true);
    }
  });
  desktopQuery.addEventListener("change", () => {
    if (!desktop() && (mode === "mega" || mode === "search")) closeAll(false);
    if (desktop() && mode === "drawer") closeAll(false);
  });

  function currentSlug() {
    const raw = decodeURIComponent(location.hash.replace(/^#\/?/, "")).replace(/\/$/, "");
    if (!raw) return "index";
    return bySlug.has(raw) ? raw : null;
  }

  function renderPage() {
    const slug = currentSlug();
    if (!slug) {
      document.title = "Page not found — Indiana Zooniversity";
      main.innerHTML = `<article class="interior"><h1>Page not found</h1><p class="lede"><a href="#/">Back to home</a></p></article>`;
      return;
    }
    if (slug === "index") {
      const home = DATA.home;
      document.title = "Indiana Zooniversity — Mega menu (hover)";
      main.innerHTML = `<article class="hero"><p class="hero-eyebrow">${esc(home.eyebrow)}</p><h1>${esc(home.heading)}</h1><p class="lede">${esc(home.lede)}</p><a class="btn-strong" href="${href(home.actionSlug)}" data-nav>${esc(home.actionLabel)} <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" d="M1 7h10.844L7.737 2.146 9.263.854 15.31 8l-6.047 7.146-1.526-1.292L11.844 9H1V7Z"/></svg></a></article><figure class="hero-figure"><img src="${esc(home.image)}" alt="${esc(home.alt)}"></figure>`;
      return;
    }
    const node = bySlug.get(slug);
    document.title = `${node.label} — Indiana Zooniversity`;
    const trail = sectionTrail(slug);
    const crumbs = [`<li><a href="#/">Home</a></li>`].concat(trail.map((item, i) => {
      const last = i === trail.length - 1;
      const body = last ? esc(item.label) : `<a href="${href(item.slug)}">${esc(item.label)}</a>`;
      return `<li><span aria-hidden="true">/</span> ${body}</li>`;
    })).join("");
    const cards = (node.children || []).map((child) => `<a class="card" href="${href(child.slug)}" data-nav><strong>${esc(child.label)}</strong>${child.lede ? `<p>${esc(child.lede)}</p>` : ""}</a>`).join("");
    const eyebrow = node.eyebrow ? `<p class="page-eyebrow">${esc(node.eyebrow)}</p>` : "";
    main.innerHTML = `<article class="interior">${eyebrow}<nav aria-label="Breadcrumb"><ol class="crumbs">${crumbs}</ol></nav><h1>${esc(node.heading || node.label)}</h1>${node.lede ? `<p class="lede">${esc(node.lede)}</p>` : ""}${cards ? `<div class="card-grid">${cards}</div>` : ""}</article>`;
  }

  window.addEventListener("hashchange", () => {
    closeAll(false);
    renderPage();
    main.focus?.();
  });
  renderPage();
})();
</script>
